{% load static %}
<button id="conciergeToggle" class="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-ink text-white pl-4 pr-5 py-3.5 shadow-xl hover:bg-gold-500 hover:text-ink transition-colors rounded-full">
  <i data-lucide="sparkles" class="w-4 h-4 text-gold-400 group-hover:text-ink"></i>
  <span class="text-sm font-semibold hidden sm:inline"> Ask AI</span>
</button>

<div id="conciergePanel" class="hidden fixed bottom-24 right-6 z-50 w-[92vw] max-w-sm bg-white border border-grey-200 shadow-2xl flex flex-col overflow-hidden" style="height:520px;">
  <div class="bg-ink text-white px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gold-400/20 border border-gold-400/40 flex items-center justify-center">
        <i data-lucide="sparkles" class="w-4 h-4 text-gold-400"></i>
      </div>
      <div>
        <p class="text-sm font-semibold">Xcep — AI Concierge</p>
        <p class="text-[11px] text-grey-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-400 rounded-full inline-block"></span> Online now</p>
      </div>
    </div>
    <button id="conciergeClose" class="text-grey-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
  </div>

  <div id="conciergeMessages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-grey-50 text-sm">
    <div class="bg-white border border-grey-200 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[85%]">
      Good day! I'm Xcep, your AI concierge. Ask me about room rates, availability, the pool, restaurant hours — or tell me what you need, e.g. <em>"bring towels and jollof rice to room 204."</em>
    </div>
  </div>

  <div class="border-t border-grey-200 px-3 py-3 bg-white">
    <div class="flex flex-wrap gap-2 mb-2">
      <button class="concierge-chip text-[11px] px-2.5 py-1 border border-grey-200 rounded-full hover:border-gold-400 hover:text-gold-600">Room rates</button>
      <button class="concierge-chip text-[11px] px-2.5 py-1 border border-grey-200 rounded-full hover:border-gold-400 hover:text-gold-600">Pool hours</button>
      <button class="concierge-chip text-[11px] px-2.5 py-1 border border-grey-200 rounded-full hover:border-gold-400 hover:text-gold-600">Recommend a room</button>
      <button class="concierge-chip text-[11px] px-2.5 py-1 border border-grey-200 rounded-full hover:border-gold-400 hover:text-gold-600">Order room service</button>
    </div>
    <form id="conciergeForm" class="flex items-center gap-2">
      <input id="conciergeInput" type="text" placeholder="Type a message…" autocomplete="off"
        class="flex-1 border border-grey-300 px-3 py-2.5 text-sm focus:outline-none focus:border-gold-400 rounded-full">
      <button type="submit" class="w-10 h-10 shrink-0 flex items-center justify-center bg-ink text-white rounded-full hover:bg-gold-500 hover:text-ink transition-colors">
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </form>
    <p class="text-[10px] text-grey-400 mt-2 flex items-center gap-1"><i data-lucide="message-circle" class="w-3 h-3"></i> Also available on WhatsApp: +234 803 000 1122</p>
  </div>
</div>
